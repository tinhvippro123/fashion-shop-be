server:
  port: 8080

spring:
  application:
    name: fashion-be
  datasource:
    url: jdbc:h2:file:./data/fashiondb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: LuxeFashionOopUniversityCourseSecretKeyForJwtHs256Authentication2026!
    expiration-ms: 604800000
  cors:
    allowed-origins: http://localhost:3000,http://127.0.0.1:3000

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fashion_shop}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:fashion_user}
    password: ${DB_PASSWORD:fashion_password}
  jpa:
    hibernate:
      ddl-auto: update

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:fashiontestdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop

